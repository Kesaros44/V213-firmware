name: Build krsplit v213 firmware

on:
  push:
  workflow_dispatch:

jobs:
  build-default:
    name: Build default (mainline QMK, no Vial)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          fetch-depth: 1
          path: qmk_firmware

      - name: Copy keyboard files into QMK tree
        run: |
          mkdir -p qmk_firmware/keyboards/krsplit/v213/keymaps/default
          cp config.h keyboard.json krsplit.c krsplit.h rules.mk qmk_firmware/keyboards/krsplit/v213/
          cp keymaps/default/keymap.c qmk_firmware/keyboards/krsplit/v213/keymaps/default/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AVR toolchain + QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr avrdude
          pip install -r qmk_firmware/requirements.txt
          pip install qmk

      - name: Build firmware
        working-directory: qmk_firmware
        run: |
          qmk config user.qmk_home="$(pwd)"
          make krsplit/v213:default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: krsplit_v213_default
          path: qmk_firmware/*.hex
          if-no-files-found: error

  build-vial:
    name: Build vial (vial-qmk fork, Vial GUI 지원)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Vial QMK
        uses: actions/checkout@v4
        with:
          repository: vial-kb/vial-qmk
          submodules: recursive
          fetch-depth: 1
          path: vial-qmk

      - name: Copy keyboard files into Vial QMK tree
        run: |
          mkdir -p vial-qmk/keyboards/krsplit/v213/keymaps/vial
          cp config.h keyboard.json krsplit.c krsplit.h rules.mk vial-qmk/keyboards/krsplit/v213/
          cp keymaps/vial/keymap.c keymaps/vial/rules.mk keymaps/vial/config.h keymaps/vial/vial.json vial-qmk/keyboards/krsplit/v213/keymaps/vial/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AVR toolchain + QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr avrdude
          pip install -r vial-qmk/requirements.txt
          pip install qmk

      - name: Build firmware
        working-directory: vial-qmk
        run: |
          qmk config user.qmk_home="$(pwd)"
          make krsplit/v213:vial

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: krsplit_v213_vial
          path: vial-qmk/*.hex
          if-no-files-found: error
